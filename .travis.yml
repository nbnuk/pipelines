sudo: true
language: java
services:
  - docker
jdk:
  - openjdk8
branches:
  only:
  - master-nbn
before_install:
  - mkdir -p ~/.m2; wget -q -O ~/.m2/settings.xml https://raw.githubusercontent.com/nbnuk/travis-build-configuration/master/travis_maven_settings.xml
  - cd $TRAVIS_BUILD_DIR
install: true
script: >
  [ "${TRAVIS_PULL_REQUEST}" = "false" ] &&
  mvn deploy -B -Dmaven.test.skip=true
  -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
  -pl livingatlas/pipelines -am -P livingatlas-artifacts
  ||
  mvn install -B -Dmaven.test.skip=true
  -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
  -pl livingatlas/pipelines -am -P livingatlas-artifacts
env:
  global:
  - secure: 
  - secure: 
